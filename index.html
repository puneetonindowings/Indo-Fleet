<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>RPAV Hexacopter - Floating Drone</title>
<style>
*{box-sizing:border-box;margin:0}
body{min-height:100vh;display:flex;align-items:center;justify-content:center;background:#f5f5f5;font-family:system-ui,sans-serif;overflow:hidden;padding:2vh 3vw}
.wrap{width:min(94vw,150vh)}
.hover{animation:hover 4s ease-in-out infinite}
.sway{position:relative;aspect-ratio:1366/768;width:100%;animation:sway 6s ease-in-out infinite;transform-origin:50% 30%}
.sway img{position:absolute;inset:0;width:100%;height:100%;object-fit:contain;mix-blend-mode:multiply}
.rotor{position:absolute;transform:translate(-50%,-50%);perspective:600px;pointer-events:none}
.disc{width:100%;aspect-ratio:1;border-radius:50%;background:conic-gradient(from 0deg,rgba(30,30,30,.55) 0deg,rgba(30,30,30,.05) 40deg,transparent 90deg,rgba(30,30,30,.55) 180deg,rgba(30,30,30,.05) 220deg,transparent 270deg);-webkit-mask:radial-gradient(circle,transparent 6%,#000 8%,#000 68%,transparent 71%);mask:radial-gradient(circle,transparent 6%,#000 8%,#000 68%,transparent 71%);animation:spin .12s linear infinite}
.rev{animation-direction:reverse}
.dot{position:absolute;border-radius:50%;transform:translate(-50%,-50%);pointer-events:none}
.nav{width:3%;aspect-ratio:1;animation:blink 1.4s ease-in-out infinite;mix-blend-mode:screen;filter:blur(2px)}
.rec{width:1.6%;aspect-ratio:1;left:50.3%;top:47.3%;background:radial-gradient(circle,#ff2a2a 0%,transparent 70%);animation:rec 1s steps(1) infinite}
.glint{width:5%;aspect-ratio:1;left:50.2%;top:71.5%;background:radial-gradient(circle at 35% 35%,rgba(255,255,255,.9) 0%,transparent 45%);animation:glint 3.5s ease-in-out infinite}
.shadow{margin:-1rem auto 0;height:1.5rem;width:50%;border-radius:50%;background:rgba(0,0,0,.25);filter:blur(24px);animation:shadow 4s ease-in-out infinite}
@keyframes hover{0%,100%{transform:translateY(0)}50%{transform:translateY(-3vh)}}
@keyframes sway{0%,100%{transform:rotate(-.8deg)}50%{transform:rotate(.8deg)}}
@keyframes shadow{0%,100%{transform:scaleX(1);opacity:.9}50%{transform:scaleX(.82);opacity:.55}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes blink{0%,40%,100%{opacity:.15;transform:translate(-50%,-50%) scale(.8)}10%,25%{opacity:1;transform:translate(-50%,-50%) scale(1.2)}}
@keyframes rec{0%,49%{opacity:1}50%,100%{opacity:.1}}
@keyframes glint{0%,70%,100%{opacity:0}80%{opacity:.7}}
</style></head><body>
